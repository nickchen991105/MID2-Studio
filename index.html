<!DOCTYPE html>
<html lang="TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/index.css">
    <title>MID2 Studio</title>
</head>
<body>
    <div id="loader-wrapper">
  <div class="loader-content">
    <div class="logo-container">
      <!-- 圓形繪製動畫：r="45" 圓周長約為 2 * π * 45 ≈ 283 -->
      <svg class="circle-svg" viewBox="0 0 100 100">
        <circle class="circle-bg" cx="50" cy="50" r="45" />
        <circle class="circle-path" cx="50" cy="50" r="45" />
      </svg>
      
      <!-- 中央 Logo (可換成你的 Logo SVG 或圖片) -->
      <div class="logo-icon">
        <img src="./img/MID2-logo.svg" alt="Logo">
      </div>
    </div>

    <!-- 後續展開的品牌文字 -->
    <div class="brand-text">MID2 Studio</div>
  </div>
</div>



<!-- From Uiverse.io by preet_7613 --> 
<main class="my-custom-face-container">
  <svg class="face" viewBox="0 0 320 380">
    <g
      fill="none"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="25"
    >
      <g class="face__eyes" transform="translate(0,112.5)">
        <g transform="translate(15,0)">
          <polyline class="face__eye-lid" points="37,0 0,120 75,120"></polyline>
          <polyline
            class="face__pupil"
            points="55,120 55,155"
            stroke-dasharray="35 35"
          ></polyline>
        </g>
        <g transform="translate(230,0)">
          <polyline class="face__eye-lid" points="37,0 0,120 75,120"></polyline>
          <polyline
            class="face__pupil"
            points="55,120 55,155"
            stroke-dasharray="35 35"
          ></polyline>
        </g>
      </g>
      <rect
        class="face__nose"
        x="132.5"
        y="112.5"
        width="55"
        height="155"
        rx="4"
        ry="4"
      ></rect>
      <g transform="translate(65,334)" stroke-dasharray="102 102">
        <path class="face__mouth-left" d="M 0 30 C 0 30 40 0 95 0"></path>
        <path class="face__mouth-right" d="M 95 0 C 150 0 190 30 190 30"></path>
      </g>
    </g>
  </svg>
</main>


<script src="./script/index.js"></script>
</body>
</html>
